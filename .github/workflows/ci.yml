name: Auto Vehicle Pricing CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Lint with flake8
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero
    
    - name: Test data preparation
      run: |
        python -c "
        import pandas as pd
        import os
        from sklearn.model_selection import train_test_split
        from sklearn.preprocessing import LabelEncoder
        
        # Test data loading
        df = pd.read_csv('data/used_cars.csv')
        print(f'Data loaded successfully: {df.shape}')
        
        # Test preprocessing
        le = LabelEncoder()
        df['Segment'] = le.fit_transform(df['Segment'])
        print('Preprocessing completed')
        
        # Test train/test split
        train_df, test_df = train_test_split(df, test_size=0.2, random_state=42)
        print(f'Train set: {train_df.shape}, Test set: {test_df.shape}')
        "
    
    - name: Test model training (local)
      run: |
        python -c "
        import pandas as pd
        from sklearn.ensemble import RandomForestRegressor
        from sklearn.metrics import mean_squared_error
        from sklearn.model_selection import train_test_split
        from sklearn.preprocessing import LabelEncoder
        
        # Load and prepare data
        df = pd.read_csv('data/used_cars.csv')
        le = LabelEncoder()
        df['Segment'] = le.fit_transform(df['Segment'])
        
        # Split data
        train_df, test_df = train_test_split(df, test_size=0.2, random_state=42)
        
        # Prepare features and target
        y_train = train_df['price']
        X_train = train_df.drop(columns=['price'])
        y_test = test_df['price']
        X_test = test_df.drop(columns=['price'])
        
        # Train model
        model = RandomForestRegressor(n_estimators=10, max_depth=5, random_state=42)
        model.fit(X_train, y_train)
        
        # Test predictions
        y_pred = model.predict(X_test)
        mse = mean_squared_error(y_test, y_pred)
        print(f'Model trained successfully. MSE: {mse:.2f}')
        "

  azure-ml-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Run Azure ML Pipeline
      env:
        SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
        RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
        WORKSPACE_NAME: ${{ secrets.WORKSPACE_NAME }}
        EXPERIMENT_NAME: ${{ secrets.EXPERIMENT_NAME }}
      run: |
        python run_pipeline.py
