name: Auto Vehicle Pricing CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Manual trigger

permissions:
  id-token: write  # For OIDC authentication
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 data-science/src --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 data-science/src --count --exit-zero --max-line-length=127
    
    - name: Test data preparation
      run: |
        python -c "
        import pandas as pd
        from sklearn.model_selection import train_test_split
        from sklearn.preprocessing import LabelEncoder
        
        df = pd.read_csv('data/used_cars.csv')
        print(f'✅ Data loaded: {df.shape}')
        
        le = LabelEncoder()
        df['Segment'] = le.fit_transform(df['Segment'])
        print('✅ Preprocessing completed')
        
        train_df, test_df = train_test_split(df, test_size=0.2, random_state=42)
        print(f'✅ Train: {train_df.shape}, Test: {test_df.shape}')
        "
    
    - name: Test model training (local)
      run: |
        python -c "
        import pandas as pd
        from sklearn.ensemble import RandomForestRegressor
        from sklearn.metrics import mean_squared_error
        from sklearn.model_selection import train_test_split
        from sklearn.preprocessing import LabelEncoder
        
        df = pd.read_csv('data/used_cars.csv')
        le = LabelEncoder()
        df['Segment'] = le.fit_transform(df['Segment'])
        
        train_df, test_df = train_test_split(df, test_size=0.2, random_state=42)
        y_train = train_df['price']
        X_train = train_df.drop(columns=['price'])
        y_test = test_df['price']
        X_test = test_df.drop(columns=['price'])
        
        model = RandomForestRegressor(n_estimators=10, max_depth=5, random_state=42)
        model.fit(X_train, y_train)
        
        y_pred = model.predict(X_test)
        mse = mean_squared_error(y_test, y_pred)
        print(f'✅ Model trained. MSE: {mse:.2f}')
        assert mse > 0, 'MSE validation failed'
        "

  deploy-to-azure-ml:
    name: Deploy to Azure ML (Production)
    runs-on: ubuntu-latest
    needs: test  # Only run after tests pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'
    
    # Option 1: OIDC Authentication (Recommended - More Secure)
    # Uncomment these lines and comment out the service principal login below
    # - name: Azure login (OIDC)
    #   uses: azure/login@v2
    #   with:
    #     client-id: ${{ secrets.AZURE_CLIENT_ID }}
    #     tenant-id: ${{ secrets.AZURE_TENANT_ID }}
    #     subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
    # Option 2: Service Principal Authentication (Your Current Setup)
    - name: Azure Login (Service Principal)
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Install Azure ML CLI
      run: |
        az extension add -n ml -y || az extension update -n ml
    
    - name: Set Azure ML defaults
      run: |
        az configure --defaults \
          group=${{ secrets.RESOURCE_GROUP }} \
          workspace=${{ secrets.WORKSPACE_NAME }}
    
    # Method 1: Using Python SDK (Your current approach)
    - name: Submit Pipeline via Python SDK
      env:
        SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
        RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
        WORKSPACE_NAME: ${{ secrets.WORKSPACE_NAME }}
        EXPERIMENT_NAME: ${{ secrets.EXPERIMENT_NAME }}
      run: |
        echo "🚀 Submitting production pipeline with hyperparameter sweep..."
        python run_pipeline.py
    
    # Method 2: Using Azure CLI (Alternative - with live logs)
    # Uncomment to use CLI instead of Python SDK
    # - name: Submit Pipeline via Azure CLI
    #   run: |
    #     echo "🚀 Submitting pipeline via Azure CLI..."
    #     az ml job create -f mlops/azureml/train/complete_pipeline.yml --stream
    
    - name: Pipeline Submitted
      run: |
        echo "✅ Pipeline submitted successfully!"
        echo "📊 Check Azure ML Studio for 20 sweep trials and best model selection"