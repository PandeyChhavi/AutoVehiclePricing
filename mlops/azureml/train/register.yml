$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: register_model
display_name: Register Best Model
description: Registers the best model from the training job
type: command
inputs:
  model:
    type: uri_folder  # Changed from mlflow_model to uri_folder
    description: Trained model to register
outputs:
  registered_model:
    type: uri_folder
    description: Model registration info
code: ../../../data-science/src
command: >-
  python register.py
  --model_name used_cars_price_prediction_model
  --model_path ${{inputs.model}}
  --model_info_output_path ${{outputs.registered_model}}
environment: azureml:used_cars_train_env_v2@latest